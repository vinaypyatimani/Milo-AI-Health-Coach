# Linting: run `ruff check .` from the backend/ folder.
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (F), real errors (E4/E7/E9) and common bugs (B).
select = ["E4", "E7", "E9", "F", "B"]
# B008: FastAPI's File(...) in a parameter default is the intended pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
